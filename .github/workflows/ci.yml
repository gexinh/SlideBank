name: Release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test example and local-image isolation
        run: node --test tests/test_project_viewer.cjs

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install UI and package
        run: python -m pip install -e '.[ui]'
      - name: Test portable backend and workbench
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir /tmp/slidebank-wheel .
