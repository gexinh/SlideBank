[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidebank"
version = "0.1.0"
description = "Hierarchical visual memory for whole-slide image question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ui = ["gradio>=5.34,<6"]
wsi = [
  "opencv-python-headless>=4.8,<5",
  "openslide-python>=1.4,<2",
  "openslide-bin>=4,<5",
  "tifffile>=2024.1.30",
  "imagecodecs>=2024.1.1",
]
local = [
  "torch>=2.0,<3",
  "torchvision>=0.15,<1",
  "transformers>=4.49,<5",
  "accelerate>=1,<2",
  "sentencepiece>=0.2,<1",
]
gemini = ["google-genai>=1,<2"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["slidebank*"]

[tool.setuptools.package-data]
"slidebank.wsi_agent" = ["signal_ontology.json"]

[tool.setuptools.data-files]
"share/doc/slidebank" = ["docs/THIRD_PARTY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
